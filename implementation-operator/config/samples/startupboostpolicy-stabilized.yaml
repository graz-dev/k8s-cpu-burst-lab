apiVersion: startup.boost.io/v1alpha1
kind: StartupBoostPolicy
metadata:
  name: petclinic-boost
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: petclinic

  containers:
    - name: petclinic
      steadyCPU: 300m

  # Keep the boost for 30 seconds after Ready, then shrink.
  stabilizationSeconds: 30
