apiVersion: startup.boost.io/v1alpha1
kind: StartupBoostPolicy
metadata:
  name: petclinic-boost
spec:
  # Pods in the same namespace with these labels are managed by the policy.
  selector:
    matchLabels:
      app.kubernetes.io/name: petclinic

  # Only CPU is changed. Memory is left alone so the Pod stays Burstable.
  containers:
    - name: petclinic
      steadyCPU: 300m

  # Seconds to wait after Ready before resizing. 0 shrinks right at Ready.
  stabilizationSeconds: 0
