apiVersion: v1
kind: ServiceAccount
metadata:
  name: startup-boost-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: startup-boost-controller
rules:
  # List Pods and read their conditions.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # kubectl patch --subresource=resize does a GET and then a PATCH on pods/resize.
  - apiGroups: [""]
    resources: ["pods/resize"]
    verbs: ["get", "patch", "update"]
  # Annotate a Pod after it has been resized, so it is not resized twice.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: startup-boost-controller
subjects:
  - kind: ServiceAccount
    name: startup-boost-controller
roleRef:
  kind: Role
  name: startup-boost-controller
  apiGroup: rbac.authorization.k8s.io
