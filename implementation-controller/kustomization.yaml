apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cpu-burst-demo

resources:
  - ../base
  - ../base/namespace-demo
  - ../scripts/lib
  - rbac.yaml
  - configmap-hook.yaml
  - deployment-controller.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: cpu-burst-lab
      lab.scenario: controller
    includeTemplates: true

patches:
  # The controller only manages Pods that carry startup-boost=enabled.
  - target:
      kind: Deployment
      name: petclinic
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: petclinic
      spec:
        template:
          metadata:
            labels:
              startup-boost: enabled
