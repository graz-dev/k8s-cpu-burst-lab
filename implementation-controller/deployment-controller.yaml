apiVersion: apps/v1
kind: Deployment
metadata:
  name: startup-boost-controller
  labels:
    app.kubernetes.io/name: startup-boost-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: startup-boost-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: startup-boost-controller
    spec:
      nodeSelector:
        demo/role: worker
      serviceAccountName: startup-boost-controller
      volumes:
        - name: hooks
          configMap:
            name: startup-boost-hook
            defaultMode: 0755
        - name: resize-lib
          configMap:
            name: resize-lib
      containers:
        - name: controller
          image: alpine/k8s:1.37.1
          command: ["/bin/sh", "/hooks/controller.sh"]
          volumeMounts:
            - name: hooks
              mountPath: /hooks
            - name: resize-lib
              mountPath: /lib/resize
          env:
            - name: CONTROLLER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: STEADY_CPU
              value: 300m
            - name: CONTAINER_NAME
              value: petclinic
            - name: POLL_INTERVAL
              value: "5"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
