apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cpu-burst-compare
nameSuffix: -boost

resources:
  - ../../../base
  - startupboostpolicy.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: cpu-burst-lab
      lab.scenario: compare
      lab.variant: boost
