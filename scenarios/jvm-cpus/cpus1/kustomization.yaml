apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cpu-burst-jvm
nameSuffix: -cpus1

resources:
  - ../../../base

labels:
  - pairs:
      app.kubernetes.io/part-of: cpu-burst-lab
      lab.scenario: jvm-cpus
      lab.variant: cpus1
    includeSelectors: true
    includeTemplates: true

patches:
  - target:
      kind: Deployment
      name: petclinic
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -Xlog:gc+init=info -XX:ActiveProcessorCount=1"
