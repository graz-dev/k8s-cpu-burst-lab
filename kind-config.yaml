# kind-config.yaml
# 2-node cluster (1 control plane + 1 worker) on Kubernetes v1.37.
# In-Place Pod Resize is stable and locked on since v1.35, so no feature gates are set.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cpu-burst-lab

nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    # Grafana is a NodePort service on 30300 inside the cluster. This mapping
    # makes it reachable on the host at http://localhost:3000.
    extraPortMappings:
      - containerPort: 30300
        hostPort: 3000
        protocol: TCP

  # All lab workloads are pinned here with nodeSelector demo/role=worker.
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    labels:
      demo/role: worker
