apiVersion: v1
kind: ConfigMap
metadata:
  name: startup-resizer-script
data:
  resize.sh: |
    #!/bin/sh
    # Waits until the app container is Ready, shrinks its CPU in place, then
    # idles. Runs inside the same Pod as the app. The resize helpers come from
    # the shared resize-lib ConfigMap.
    set -eu

    STEADY_CPU="${STEADY_CPU:-300m}"
    CONTAINER_NAME="${CONTAINER_NAME:-petclinic}"
    CHECK_INTERVAL="${CHECK_INTERVAL:-2}"
    HEALTH_TIMEOUT="${HEALTH_TIMEOUT:-600}"

    RESIZE_LOG_PREFIX="[sidecar]"
    # shellcheck source=/dev/null
    . /lib/resize/resize.sh

    resize_log "started for pod ${POD_NAME} in ${POD_NAMESPACE}, target ${CONTAINER_NAME} cpu=${STEADY_CPU}"

    deadline=$(( $(date +%s) + HEALTH_TIMEOUT ))
    while :; do
      ready="$(kubectl get pod "${POD_NAME}" -n "${POD_NAMESPACE}" \
        -o jsonpath="{.status.containerStatuses[?(@.name==\"${CONTAINER_NAME}\")].ready}" 2>/dev/null || true)"
      [ "${ready}" = "true" ] && break
      if [ "$(date +%s)" -ge "${deadline}" ]; then
        resize_log "timeout after ${HEALTH_TIMEOUT}s waiting for ${CONTAINER_NAME} to be Ready"
        exit 1
      fi
      sleep "${CHECK_INTERVAL}"
    done

    resize_log "${CONTAINER_NAME} is Ready, requesting cpu=${STEADY_CPU}"
    resize_patch "${POD_NAME}" "${POD_NAMESPACE}" "${CONTAINER_NAME}" "${STEADY_CPU}"
    resize_log "resize requested"

    if resize_wait "${POD_NAME}" "${POD_NAMESPACE}" "${CONTAINER_NAME}" "${STEADY_CPU}" 120 1; then
      resize_log "done, idling"
    else
      resize_log "resize did not complete"
      exit 1
    fi

    while :; do sleep 3600; done
