apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cpu-burst-demo

resources:
  - ../base
  - ../base/namespace-demo
  - ../scripts/lib
  - rbac.yaml
  - configmap-sidecar-script.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: cpu-burst-lab
      lab.scenario: sidecar
    includeTemplates: true

patches:
  - path: patch-sidecar.yaml
    target:
      kind: Deployment
      name: petclinic
