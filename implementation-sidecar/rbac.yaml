apiVersion: v1
kind: ServiceAccount
metadata:
  name: startup-resizer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: startup-resizer
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # kubectl patch --subresource=resize does a GET and then a PATCH on pods/resize.
  - apiGroups: [""]
    resources: ["pods/resize"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: startup-resizer
subjects:
  - kind: ServiceAccount
    name: startup-resizer
roleRef:
  kind: Role
  name: startup-resizer
  apiGroup: rbac.authorization.k8s.io
