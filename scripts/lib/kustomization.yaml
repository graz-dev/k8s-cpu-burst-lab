# Packages resize.sh as a ConfigMap so the sidecar and controller run the same
# code as the host scripts. Overlays include this directory as a resource.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: resize-lib
    files:
      - resize.sh
