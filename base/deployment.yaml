# Spring Petclinic on JDK 25, started with a CPU boost: request = limit = 1500m.
# Memory stays at requests 512Mi / limits 1Gi, so the Pod is Burstable and the
# CPU request can equal the CPU limit without changing the QoS class.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic
  labels:
    app.kubernetes.io/name: petclinic
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: petclinic
  template:
    metadata:
      labels:
        app.kubernetes.io/name: petclinic
    spec:
      nodeSelector:
        demo/role: worker
      containers:
        - name: petclinic
          image: ghcr.io/graz-dev/spring-petclinic-jdk25:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 1500m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 1Gi
          # CPU changes apply in place. Memory changes restart the container.
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: RestartContainer
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            failureThreshold: 3
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0"
            - name: OTEL_SDK_DISABLED
              value: "true"
